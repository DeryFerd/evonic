<div class="space-y-4">
    <!-- Header -->
    <div class="settings-pane-head">
        <h2 class="settings-pane-title">User Management</h2>
        <p class="settings-pane-desc">View and manage registered users. Block or unblock users, and view audit trail.</p>
    </div>

    <!-- Filter Bar -->
    <div class="flex items-center gap-2 flex-wrap">
        <select id="users-status-filter" onchange="usersTab.load()"
                class="setting-select">
            <option value="all">All Users</option>
            <option value="approved">Approved</option>
            <option value="blocked">Blocked</option>
            <option value="pending">Pending</option>
        </select>
        <span id="users-count" class="text-xs text-gray-400 ml-1"></span>
    </div>

    <!-- Users Table -->
    <div class="setting-group-body overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead>
                <tr class="text-[11px] uppercase tracking-wider text-gray-400 dark:text-gray-500 border-b border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/30">
                    <th class="px-4 py-3 font-semibold">User</th>
                    <th class="px-4 py-3 font-semibold text-center">Status</th>
                    <th class="px-4 py-3 font-semibold">Block Details</th>
                    <th class="px-4 py-3 font-semibold">Last Active</th>
                    <th class="px-4 py-3 font-semibold text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <tr><td colspan="5" class="text-center py-8 text-gray-400">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div id="users-pagination" class="flex items-center justify-center gap-2 mt-4 hidden">
        <button onclick="usersTab.goPage(usersTab.page - 1)"
                id="users-prev"
                class="px-3 py-1.5 rounded-md text-sm border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
            ← Prev
        </button>
        <span id="users-page-info" class="text-sm text-gray-500 dark:text-gray-400"></span>
        <button onclick="usersTab.goPage(usersTab.page + 1)"
                id="users-next"
                class="px-3 py-1.5 rounded-md text-sm border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
            Next →
        </button>
    </div>
</div>

<!-- Audit Log Modal -->
<div id="audit-modal" class="modal" style="display:none;">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-lg mx-4 flex flex-col max-h-[80vh]">
        <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-gray-100 dark:border-gray-700 flex-shrink-0">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">Audit Trail</h3>
            <button onclick="document.getElementById('audit-modal').style.display='none'" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <div id="audit-modal-body" class="px-6 py-4 overflow-y-auto">
            <p class="text-gray-400 text-sm">Loading...</p>
        </div>
    </div>
</div>

<script>
(function() {
    window.usersTab = {
        page: 0,
        limit: 50,

        init: function() {
            usersTab.page = 0;
            usersTab.load();
        },

        load: function() {
            var filter = document.getElementById('users-status-filter').value;
            var offset = usersTab.page * usersTab.limit;
            var url = '/api/settings/users?filter=' + filter + '&limit=' + usersTab.limit + '&offset=' + offset;

            document.getElementById('users-table-body').innerHTML =
                '<tr><td colspan="5" class="text-center py-8 text-gray-400">Loading...</td></tr>';

            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    usersTab.render(data);
                })
                .catch(function(err) {
                    document.getElementById('users-table-body').innerHTML =
                        '<tr><td colspan="5" class="text-center py-8 text-red-500">Error loading users: ' + err.message + '</td></tr>';
                });
        },

        render: function(data) {
            var users = data.users || [];
            var total = data.total || 0;
            var tbody = document.getElementById('users-table-body');
            var countEl = document.getElementById('users-count');
            var pagination = document.getElementById('users-pagination');

            countEl.textContent = '(' + total + ' user' + (total !== 1 ? 's' : '') + ')';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-400">No users found</td></tr>';
                pagination.classList.add('hidden');
                return;
            }

            var html = '';
            for (var i = 0; i < users.length; i++) {
                var u = users[i];
                var statusBadge = usersTab.statusBadge(u);
                var lastActive = u.last_active_at ? usersTab.formatDate(u.last_active_at) : '—';
                var initial = (u.name || u.id || '?').trim().charAt(0).toUpperCase() || '?';

                // Consolidated block details: reason + "by X · date"
                var blockCell = '<span class="text-gray-300 dark:text-gray-600">—</span>';
                if (u.blocked_at) {
                    var reason = u.blocked_reason || 'No reason given';
                    var meta = (u.blocked_by ? 'by ' + usersTab.esc(u.blocked_by) + ' · ' : '') + usersTab.formatDate(u.blocked_at);
                    blockCell = '<div class="max-w-[220px]">'
                        + '<div class="text-xs text-gray-700 dark:text-gray-300 truncate" title="' + usersTab.esc(reason) + '">' + usersTab.esc(reason) + '</div>'
                        + '<div class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">' + meta + '</div>'
                        + '</div>';
                }

                html += '<tr class="border-b border-gray-100 dark:border-gray-700/60 last:border-0 hover:bg-gray-50 dark:hover:bg-gray-700/40 transition-colors">';
                html += '<td class="px-4 py-3"><div class="flex items-center gap-3">'
                    + '<span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 flex items-center justify-center text-xs font-semibold flex-shrink-0">' + usersTab.esc(initial) + '</span>'
                    + '<div class="min-w-0">'
                    + '<div class="font-medium text-gray-800 dark:text-gray-100 truncate">' + usersTab.esc(u.name || '') + '</div>'
                    + '<div class="font-mono text-[11px] text-gray-400 dark:text-gray-500 truncate">' + usersTab.esc(u.id || '') + '</div>'
                    + '</div></div></td>';
                html += '<td class="px-4 py-3 text-center">' + statusBadge + '</td>';
                html += '<td class="px-4 py-3">' + blockCell + '</td>';
                html += '<td class="px-4 py-3 text-gray-500 dark:text-gray-400 text-xs whitespace-nowrap">' + lastActive + '</td>';
                html += '<td class="px-4 py-3 text-right whitespace-nowrap">';
                html += usersTab.actionButtons(u);
                html += '</td>';
                html += '</tr>';
            }

            tbody.innerHTML = html;

            // Pagination
            var totalPages = Math.ceil(total / usersTab.limit);
            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                document.getElementById('users-page-info').textContent =
                    'Page ' + (usersTab.page + 1) + ' of ' + totalPages;
                document.getElementById('users-prev').disabled = usersTab.page === 0;
                document.getElementById('users-next').disabled = usersTab.page >= totalPages - 1;
            } else {
                pagination.classList.add('hidden');
            }
        },

        goPage: function(p) {
            usersTab.page = Math.max(0, p);
            usersTab.load();
        },

        statusBadge: function(u) {
            if (u.is_approved === 2 || u.blocked_at) {
                return '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-700 border border-red-200 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Blocked</span>';
            } else if (u.is_approved === 1) {
                return '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300 dark:border-emerald-800"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Approved</span>';
            } else {
                return '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200 dark:bg-amber-900/30 dark:text-amber-300 dark:border-amber-800"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Pending</span>';
            }
        },

        actionButtons: function(u) {
            var btns = '';
            var isBlocked = u.is_approved === 2 || u.blocked_at;

            btns += '<button onclick="usersTab.showAudit(\'' + usersTab.escAttr(u.id) + '\')" ' +
                    'class="inline-flex items-center justify-center w-7 h-7 rounded-md border border-gray-200 dark:border-gray-600 text-gray-500 dark:text-gray-400 hover:text-indigo-600 hover:border-indigo-300 dark:hover:text-indigo-400 dark:hover:border-indigo-600 transition-colors mr-1.5 align-middle" ' +
                    'title="View audit trail">' +
                    '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>' +
                    '</button>';

            if (isBlocked) {
                btns += '<button onclick="usersTab.unblockUser(\'' + usersTab.escAttr(u.id) + '\')" ' +
                        'class="inline-flex items-center h-7 text-xs font-medium px-2.5 rounded-md border border-emerald-300 text-emerald-700 hover:bg-emerald-50 dark:border-emerald-700 dark:text-emerald-400 dark:hover:bg-emerald-900/30 transition-colors align-middle" ' +
                        'title="Unblock this user">Unblock</button>';
            } else {
                btns += '<button onclick="usersTab.showBlockModal(\'' + usersTab.escAttr(u.id) + '\', \'' + usersTab.escAttr(u.name || '') + '\')" ' +
                        'class="inline-flex items-center h-7 text-xs font-medium px-2.5 rounded-md border border-red-300 text-red-600 hover:bg-red-50 dark:border-red-700 dark:text-red-400 dark:hover:bg-red-900/30 transition-colors align-middle" ' +
                        'title="Block this user">Block</button>';
            }
            return btns;
        },

        showBlockModal: function(userId, userName) {
            var reason = prompt('Block user "' + userName + '"?\n\nEnter reason (optional):');
            if (reason === null) return; // user cancelled
            usersTab.blockUser(userId, reason);
        },

        blockUser: function(userId, reason) {
            fetch('/api/settings/users/' + userId + '/block', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason: reason || '' })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    usersTab.load();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(function(err) {
                alert('Error: ' + err.message);
            });
        },

        unblockUser: function(userId) {
            if (!confirm('Unblock this user? They will regain full access.')) return;
            fetch('/api/settings/users/' + userId + '/unblock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    usersTab.load();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(function(err) {
                alert('Error: ' + err.message);
            });
        },

        showAudit: function(userId) {
            var modal = document.getElementById('audit-modal');
            var body = document.getElementById('audit-modal-body');
            modal.style.display = 'flex';
            body.innerHTML = '<p class="text-gray-400 text-sm">Loading...</p>';

            fetch('/api/settings/users/' + userId + '/audit')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var logs = data.audit_logs || [];
                    if (logs.length === 0) {
                        body.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">No audit records found.</p>';
                        return;
                    }
                    var html = '<div class="space-y-3">';
                    html += '<p class="text-xs text-gray-500 mb-2">User: <code class="text-indigo-600">' + usersTab.esc(userId) + '</code> — ' + logs.length + ' record(s)</p>';
                    for (var i = 0; i < logs.length; i++) {
                        var log = logs[i];
                        var actionLabel = log.action;
                        var actionColor = 'text-gray-600 dark:text-gray-300';
                        if (log.action === 'blocked') actionColor = 'text-red-600 dark:text-red-400';
                        else if (log.action === 'unblocked') actionColor = 'text-green-600 dark:text-green-400';

                        html += '<div class="border border-gray-200 dark:border-gray-700 rounded-lg p-3">';
                        html += '<div class="flex items-center justify-between mb-1">';
                        html += '<span class="font-medium text-sm ' + actionColor + '">' + actionLabel + '</span>';
                        html += '<span class="text-xs text-gray-400">' + usersTab.formatDate(log.created_at) + '</span>';
                        html += '</div>';
                        html += '<div class="text-xs text-gray-500 dark:text-gray-400">';
                        html += 'Actor: <span class="text-gray-700 dark:text-gray-300">' + usersTab.esc(log.actor_type || '—') + '</span>';
                        if (log.actor_id) {
                            html += ' (' + usersTab.esc(log.actor_id) + ')';
                        }
                        if (log.details) {
                            try {
                                var details = JSON.parse(log.details);
                                if (details.reason) {
                                    html += '<br>Reason: ' + usersTab.esc(details.reason);
                                }
                                if (details.changes) {
                                    html += '<br>Changes: <code class="text-xs">' + usersTab.esc(JSON.stringify(details.changes)) + '</code>';
                                }
                            } catch(e) {}
                        }
                        html += '</div>';
                        html += '</div>';
                    }
                    html += '</div>';
                    body.innerHTML = html;
                })
                .catch(function(err) {
                    body.innerHTML = '<p class="text-red-500 text-sm">Error: ' + err.message + '</p>';
                });
        },

        formatDate: function(dt) {
            if (!dt) return '—';
            var d = new Date(dt.replace(' ', 'T') + (dt.indexOf('+') === -1 && dt.indexOf('Z') === -1 ? 'Z' : ''));
            if (isNaN(d.getTime())) return dt;
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) +
                ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        },

        esc: function(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        },

        escAttr: function(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/'/g, '\\\'').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    };
})();
</script>
